<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala d'Attesa e QR Code - Iscrizioni 2027</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #1a1a2e; 
            color: #ffffff; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 { 
            color: #e94560; 
            margin-top: 10px; 
            font-size: 36px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-align: center;
        }

        /* Layout principale diviso in due colonne (Schermo a sinistra, QR a destra) */
        .main-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
            margin-top: 20px;
        }

        .container-coda { 
            flex: 2;
            min-width: 320px;
            background: #16213e; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.5); 
            text-align: center;
        }

        .container-qr {
            flex: 1;
            min-width: 280px;
            background: #ffffff;
            color: #333;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .container-qr h3 {
            margin-top: 0;
            color: #1a1a2e;
            font-size: 22px;
        }

        .container-qr p {
            color: #666;
            font-size: 13px;
            line-height: 1.4;
        }

        .container-qr img {
            width: 200px;
            height: 200px;
            margin: 15px 0;
            border: 4px solid #f4f4f9;
            border-radius: 8px;
        }

        #countdown {
            font-weight: bold;
            color: #007bff;
        }

        .istruzioni { 
            font-size: 18px; 
            color: #a0aab2; 
            margin-bottom: 20px; 
        }
        
        #listaChiamati {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .biglietto-chiamato {
            background: #ffc107;
            color: #000;
            font-size: 50px;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
            animation: lampcheggio 1.2s infinite alternate;
        }

        .nessun-turno {
            font-size: 20px;
            color: #6c757d;
            font-style: italic;
            background: #0f3460;
            padding: 25px;
            border-radius: 10px;
        }

        #btnAttivaAudio {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            transition: background 0.2s;
        }
        #btnAttivaAudio:hover {
            background-color: #d73852;
        }

        @keyframes lampcheggio {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.05); opacity: 0.85; }
        }
    </style>
</head>
<body>

    <h1>Iscrizioni 2027</h1>

    <div class="main-layout">
        <!-- COLONNA SINISTRA: Monitor Chiamate e Audio -->
        <div class="container-coda">
            <button id="btnAttivaAudio">🔊 Clicca qui per attivare l'audio</button>
            <div class="istruzioni">Prossimi numeri chiamati al banco iscrizioni:</div>
            
            <div id="listaChiamati">
                <div class="nessun-turno">In attesa di chiamate...</div>
            </div>
        </div>

        <!-- COLONNA DESTRA: QR Code Dinamico per mettersi in coda -->
        <div class="container-qr">
            <h3>Prendi il tuo numero</h3>
            <p>Inquadra il QR code con lo smartphone per metterti in coda.</p>
            
            <div>
                <img id="qrImg" src="" alt="QR Code Coda">
            </div>

            <p>Aggiornamento sicurezza:<br>Prossimo cambio tra: <span id="countdown">15</span> secondi</p>
        </div>
    </div>

    <!-- Script Firebase & Sintesi Vocale + Generatore QR -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        // --- GESTIONE QR CODE DINAMICO ---
        const URL_BASE = "https://marco-desandre.github.io/openday2027/index.html";
        const INTERVALLO_SECONDI = 15;
        let secondiRimasti = INTERVALLO_SECONDI;

        function aggiornaQRCode() {
            const timestampCorrente = Date.now();
            const urlSicuro = `${URL_BASE}?t=tuchini2027&ts=${timestampCorrente}`;
            const urlQR = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(urlSicuro)}`;
            
            document.getElementById('qrImg').src = urlQR;
            secondiRimasti = INTERVALLO_SECONDI;
        }

        aggiornaQRCode();

        setInterval(() => {
            secondiRimasti--;
            document.getElementById('countdown').innerText = secondiRimasti;
            
            if (secondiRimasti <= 0) {
                aggiornaQRCode();
            }
        }, 1000);


        // --- GESTIONE FIREBASE & VOCE SALA D'ATTESA ---
        const firebaseConfig = {
            apiKey: "AIzaSyAXtD-62C2rWpsZoEhW85HN1pxTe8a5jL4",
            authDomain: "opendayiscrizioni.firebaseapp.com",
            databaseURL: "https://opendayiscrizioni-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "opendayiscrizioni",
            storageBucket: "opendayiscrizioni.firebasestorage.app",
            messagingSenderId: "448538612897",
            appId: "1:448538612897:web:437a8b17991687fc0a8ce0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const codaRef = ref(db, 'coda');

        let ultimiChiamatiNotificati = new Set();
        let audioAbilitato = false;

        document.getElementById('btnAttivaAudio').addEventListener('click', () => {
            audioAbilitato = true;
            document.getElementById('btnAttivaAudio').style.display = 'none';
            
            if ('speechSynthesis' in window) {
                const testUtterance = new SpeechSynthesisUtterance("Audio attivo");
                testUtterance.lang = 'it-IT';
                testUtterance.volume = 0.1;
                window.speechSynthesis.speak(testUtterance);
            }
        });

        function pronunciaNumero(numero) {
            if (!audioAbilitato || !('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel();

            const testoDaDire = `Attenzione. Numero... ${numero}`;
            const utterance = new SpeechSynthesisUtterance(testoDaDire);
            utterance.lang = 'it-IT';
            utterance.rate = 0.85; 
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            const voci = window.speechSynthesis.getVoices();
            const voceItalianaMigliore = voci.find(v => v.lang.includes('it') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Online'))) || voci.find(v => v.lang.includes('it'));

            if (voceItalianaMigliore) {
                utterance.voice = voceItalianaMigliore;
            }

            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        onValue(codaRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('listaChiamati');
            container.innerHTML = '';

            if (!data) {
                container.innerHTML = '<div class="nessun-turno">Nessun turno in corso.</div>';
                ultimiChiamatiNotificati.clear();
                return;
            }

            const arrayCoda = Object.keys(data).map(id => ({ id, ...data[id] }))
                .sort((a, b) => a.timestamp - b.timestamp);

            const chiamati = arrayCoda.filter(item => item.stato === 'chiamato');

            if (chiamati.length === 0) {
                container.innerHTML = '<div class="nessun-turno">Nessun numero chiamato al momento. Attendi il tuo turno.</div>';
                ultimiChiamatiNotificati.clear();
                return;
            }

            const nuoviChiamatiCorrenti = new Set();

            chiamati.forEach(persona => {
                const numeroBiglietto = arrayCoda.findIndex(p => p.id === persona.id) + 1;
                nuoviChiamatiCorrenti.add(numeroBiglietto);

                if (!ultimiChiamatiNotificati.has(numeroBiglietto)) {
                    pronunciaNumero(numeroBiglietto);
                }

                const div = document.createElement('div');
                div.className = 'biglietto-chiamato';
                div.innerText = `N° ${numeroBiglietto}`;
                container.appendChild(div);
            });

            ultimiChiamatiNotificati = nuoviChiamatiCorrenti;
        });
    </script>
</body>
</html>

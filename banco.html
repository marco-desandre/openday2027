<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pannello Banco - Coda Iscrizioni</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #ffffff; /* Sfondo del browser bianco pulito */
            padding: 15px; 
            color: #1e293b; 
            margin: 0; 
        }
        .container { 
            max-width: 650px; 
            margin: auto; 
            background: #ffffff; 
            padding: 24px 20px; 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06); 
            border: 2px solid #e2e8f0;
        }
        h2 { 
            margin-top: 0; 
            color: #991b1b; /* Rosso squadra */
            font-size: 22px; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        
        .box-limite { 
            font-size: 14px; 
            background: #f8fafc; 
            padding: 14px 18px; 
            border-radius: 16px; 
            color: #475569; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid #e2e8f0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .box-limite strong { color: #15803d; font-size: 16px; } /* Verde squadra */
        .badge-pieno { background: #991b1b !important; border-color: #7f1d1d !important; color: #ffffff !important; }
        .badge-pieno strong { color: #ffffff !important; }
        
        .btn-modifica { background: #475569; color: #ffffff; border: none; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.2s; }
        .btn-modifica:active { background: #334155; }

        .btn-riserva { 
            background: linear-gradient(135deg, #15803d 0%, #166534 100%); /* Verde squadra */
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 16px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 15px; 
            width: 100%; 
            margin-top: 18px; 
            box-shadow: 0 4px 12px rgba(21, 128, 61, 0.25);
            transition: transform 0.1s;
        }
        .btn-riserva:active { transform: scale(0.98); }

        .item-coda { 
            display: flex; 
            flex-direction: column; 
            gap: 14px;
            padding: 18px; 
            margin-top: 14px; 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            border-radius: 16px; 
            transition: all 0.2s;
        }
        @media (min-width: 480px) {
            .item-coda { flex-direction: row; justify-content: space-between; align-items: center; }
        }

        /* Stati basati su verde e rosso */
        .item-in-attesa { background: #fafafa; border-color: #e2e8f0; border-left: 6px solid #15803d; } /* Verde in attesa */
        .item-chiamato { background: #fef2f2; border-color: #fca5a5; border-left: 6px solid #dc2626; } /* Rosso chiamata */
        .item-iscritto { background: #f0fdf4; border-color: #bbf7d0; border-left: 6px solid #16a34a; } /* Verde iscritto */
        
        .badge-delega { background: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; display: inline-block; border: 1px solid #fca5a5; }
        .testo-delegante { font-size: 13px; color: #475569; margin-top: 4px; display: block; }
        .testo-telefono { font-size: 13px; color: #475569; margin-top: 2px; display: block; }
        .numero-biglietto { font-size: 15px; font-weight: 800; color: #15803d; margin-right: 10px; background: #f0fdf4; padding: 6px 10px; border-radius: 10px; display: inline-block; border: 1px solid #bbf7d0; }

        /* Finestra Modale per la Lista di Riserva */
        #modalRiserva { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(3px); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-content { background: #ffffff; padding: 24px; border-radius: 24px; width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15); border: 2px solid #e2e8f0; }
        .item-riserva { padding: 14px; border-bottom: 1px solid #f1f5f9; display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
        @media (min-width: 480px) {
            .item-riserva { flex-direction: row; justify-content: space-between; align-items: center; }
        }

        button { background: #15803d; color: white; border: none; padding: 12px 18px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 14px; width: 100%; box-shadow: 0 4px 12px rgba(21, 128, 61, 0.2); }
        @media (min-width: 480px) { button { width: auto; } }
        button:active { opacity: 0.9; transform: scale(0.98); }
        
        .btn-rimuovi { background: #64748b; box-shadow: none; }
        .btn-chiama { background: #dc2626; color: #ffffff; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25); }
        .btn-promuovi { background: #15803d; font-size: 13px; box-shadow: 0 4px 12px rgba(21, 128, 61, 0.25); }
        
        .azioni-gruppo { display: flex; gap: 10px; width: 100%; }
        @media (min-width: 480px) { .azioni-gruppo { width: auto; } }
    </style>
</head>
<body>

    <div class="container">
        <h2>
            Gestione Coda Banco
            <div id="boxLimiteContainer" class="box-limite">
                <span>In attesa: <strong id="valoreInAttesa">0</strong></span>
                <span>•</span>
                <span>Disponibili: <strong id="valoreDisponibili">0</strong>/<strong id="valoreLimite">10</strong></span>
                <button class="btn-modifica" id="btnModificaLimite">Modifica Limite</button>
            </div>
        </h2>
        
        <!-- Pulsante per aprire la Lista di Riserva -->
        <button class="btn-riserva" id="btnApriRiserve">📋 Visualizza Lista di Riserva (<span id="counterRiserve">0</span>)</button>

        <p style="margin-top: 22px; font-size: 13px; color: #991b1b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Coda attiva in tempo reale:</p>
        <div id="listaCoda">Caricamento coda...</div>
    </div>

    <!-- Modale per la Lista di Riserva -->
    <div id="modalRiserva">
        <div class="modal-content">
            <h3 style="margin-top: 0; color: #991b1b; font-size: 18px; display: flex; justify-content: space-between; align-items: center;">
                Lista di Riserva 
                <button onclick="chiudiRiserve()" style="background: #dc2626; width: auto; padding: 6px 14px; font-size: 13px; border-radius: 10px; box-shadow: none;">✕ Chiudi</button>
            </h3>
            <p style="font-size: 13px; color: #64748b; margin-top: 0;">Ordinato per orario di inserimento. Puoi promuovere un utente in coda attiva.</p>
            <div id="listaRiservaContent">Nessun utente in riserva.</div>
        </div>
    </div>

    <!-- Script Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove, set } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXtD-62C2rWpsZoEhW85HN1pxTe8a5jL4",
            authDomain: "opendayiscrizioni.firebaseapp.com",
            databaseURL: "https://opendayiscrizioni-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "opendayiscrizioni",
            storageBucket: "opendayiscrizioni.firebasestorage.app",
            messagingSenderId: "448538612897",
            appId: "1:448538612897:web:437a8b17991687fc0a8ce0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const codaRef = ref(db, 'coda');
        const limiteRef = ref(db, 'config/limiteMassimo');

        let limiteMaxCorrente = 10;
        const PASSWORD_ADMIN = "tuchini2027";
        let cacheDatiCoda = {};

        document.getElementById('btnApriRiserve').addEventListener('click', () => {
            document.getElementById('modalRiserva').style.display = 'flex';
            renderizzaListaRiserve(cacheDatiCoda);
        });

        window.chiudiRiserve = function() {
            document.getElementById('modalRiserva').style.display = 'none';
        };

        document.addEventListener('click', function(e) {
            if (e.target && e.target.id === 'btnModificaLimite') {
                const pwdInserita = prompt("Inserisci la password amministratore per modificare il limite:");
                if (pwdInserita === null) return;

                if (pwdInserita !== PASSWORD_ADMIN) {
                    alert("Password errata!");
                    return;
                }

                const nuovoLimite = prompt("Inserisci il limite massimo di posti in coda:", limiteMaxCorrente);
                if (nuovoLimite !== null && !isNaN(nuovoLimite) && nuovoLimite > 0) {
                    set(limiteRef, parseInt(nuovoLimite));
                }
            }

            if (e.target && e.target.classList.contains('azione-chiama')) {
                const idPersona = e.target.getAttribute('data-id');
                update(ref(db, 'coda/' + idPersona), { stato: 'chiamato' });
            }

            if (e.target && e.target.classList.contains('azione-conferma')) {
                const idPersona = e.target.getAttribute('data-id');
                update(ref(db, 'coda/' + idPersona), { 
                    stato: 'iscritto',
                    timestampIscritto: Date.now() 
                });
            }

            if (e.target && e.target.classList.contains('azione-rimuovi')) {
                const idPersona = e.target.getAttribute('data-id');
                if(confirm("Vuoi rimuovere definitivamente questa persona?")) {
                    remove(ref(db, 'coda/' + idPersona));
                }
            }

            if (e.target && e.target.classList.contains('azione-promuovi')) {
                const idPersona = e.target.getAttribute('data-id');
                update(ref(db, 'coda/' + idPersona), { stato: 'attesa' }).then(() => {
                    renderizzaListaRiserve(cacheDatiCoda);
                });
            }
        });

        onValue(limiteRef, (snapshot) => {
            const val = snapshot.val();
            if (val !== null) {
                limiteMaxCorrente = parseInt(val);
                const elLimite = document.getElementById('valoreLimite');
                if (elLimite) elLimite.innerText = limiteMaxCorrente;
            } else {
                set(limiteRef, 10);
            }
        });

        onValue(codaRef, (snapshot) => {
            const container = document.getElementById('listaCoda');
            
            try {
                const data = snapshot.val();
                cacheDatiCoda = data || {};
                container.innerHTML = '';

                if (!data) {
                    container.innerHTML = '<p style="color: #64748b; text-align: center; padding: 25px 0;">Nessuno in coda al momento.</p>';
                    document.getElementById('valoreDisponibili').innerText = limiteMaxCorrente;
                    document.getElementById('valoreInAttesa').innerText = 0;
                    document.getElementById('counterRiserve').innerText = 0;
                    return;
                }

                const arrayCompleto = Object.keys(data)
                    .filter(id => data[id] !== null && typeof data[id] === 'object')
                    .map(id => ({ id, ...data[id] }));

                const arrayCodaAttiva = arrayCompleto.filter(p => (p.stato || 'attesa') !== 'riserva');
                const arrayRiserve = arrayCompleto.filter(p => p.stato === 'riserva');

                document.getElementById('counterRiserve').innerText = arrayRiserve.length;

                arrayCodaAttiva.sort((a, b) => {
                    const pesoStato = (stato) => {
                        if (stato === 'chiamato') return 1;
                        if (stato === 'attesa') return 2;
                        if (stato === 'iscritto') return 3;
                        return 2;
                    };
                    
                    const pesoA = pesoStato(a.stato);
                    const pesoB = pesoStato(b.stato);

                    if (pesoA !== pesoB) return pesoA - pesoB;

                    if (a.stato === 'iscritto' && b.stato === 'iscritto') {
                        const tA = a.timestampIscritto || a.timestamp;
                        const tB = b.timestampIscritto || b.timestamp;
                        return tA - tB;
                    }

                    return a.timestamp - b.timestamp;
                });

                let postiTotaliPesati = 0;
                let personeInAttesaCount = 0;

                arrayCodaAttiva.forEach(persona => {
                    const pesoPersona = persona.delega ? 2 : 1;
                    postiTotaliPesati += pesoPersona;
                    
                    const stato = persona.stato || 'attesa';
                    if (stato === 'attesa' || stato === 'chiamato') {
                        personeInAttesaCount += pesoPersona;
                    }
                });

                let postiDisponibili = limiteMaxCorrente - postiTotaliPesati;
                if (postiDisponibili < 0) postiDisponibili = 0;

                document.getElementById('valoreDisponibili').innerText = postiDisponibili;
                document.getElementById('valoreInAttesa').innerText = personeInAttesaCount;

                const boxContainer = document.getElementById('boxLimiteContainer');
                if (boxContainer) {
                    if (postiTotaliPesati >= limiteMaxCorrente) {
                        boxContainer.classList.add('badge-pieno');
                    } else {
                        boxContainer.classList.remove('badge-pieno');
                    }
                }

                if (arrayCodaAttiva.length === 0) {
                    container.innerHTML = '<p style="color: #64748b; text-align: center; padding: 25px 0;">Nessuno in coda attiva al momento.</p>';
                    return;
                }

                const listaCronologica = [...arrayCodaAttiva].sort((a, b) => a.timestamp - b.timestamp);

                arrayCodaAttiva.forEach(persona => {
                    const numeroBiglietto = listaCronologica.findIndex(p => p.id === persona.id) + 1;
                    const div = document.createElement('div');
                    const stato = persona.stato || 'attesa';
                    
                    let classeStato = 'item-in-attesa';
                    let testoStato = '💤 In attesa';
                    let pulsantiHTML = '';

                    if (stato === 'chiamato') {
                        classeStato = 'item-chiamato';
                        testoStato = '📢 Chiamato';
                        pulsantiHTML = `<button class="azione-conferma" data-id="${persona.id}">✅ Conferma iscrizione</button>`;
                    } else if (stato === 'iscritto') {
                        classeStato = 'item-iscritto';
                        testoStato = '🟢 Iscrizione effettuata';
                        pulsantiHTML = `<button class="btn-rimuovi azione-rimuovi" data-id="${persona.id}">🗑️ Elimina</button>`;
                    } else {
                        pulsantiHTML = `<button class="btn-chiama azione-chiama" data-id="${persona.id}">📢 Chiama</button>`;
                    }

                    div.className = `item-coda ${classeStato}`;
                    
                    const etichettaDelega = persona.delega ? '<span class="badge-delega">⚠️ DELEGA (2 posti)</span>' : '';
                    const rigaDelegante = (persona.delega && persona.delegato) ? `<small class="testo-delegante">Delegante: <strong>${persona.delegato}</strong></small>` : '';
                    const rigaTelefono = persona.telefono ? `<small class="testo-telefono">📞 Tel: <strong>${persona.telefono}</strong></small>` : '';

                    div.innerHTML = `
                        <div style="text-align: left;">
                            <span class="numero-biglietto">N° ${numeroBiglietto}</span>
                            <strong style="font-size: 16px; color: #0f172a;">${persona.nome}</strong> ${etichettaDelega}
                            ${rigaTelefono}
                            ${rigaDelegante}
                            <small style="color: #64748b; display: block; margin-top: 6px;">Stato: ${testoStato}</small>
                        </div>
                        <div class="azioni-gruppo">
                            ${pulsantiHTML}
                        </div>
                    `;
                    container.appendChild(div);
                });

                if (document.getElementById('modalRiserva').style.display === 'flex') {
                    renderizzaListaRiserve(data);
                }

            } catch (err) {
                console.error("Errore di rendering:", err);
                container.innerHTML = `<p style="color: #dc2626; font-weight: bold;">Errore nello script: ${err.message}</p>`;
            }
        });

        function renderizzaListaRiserve(data) {
            const containerRiserva = document.getElementById('listaRiservaContent');
            containerRiserva.innerHTML = '';

            if (!data) {
                containerRiserva.innerHTML = '<p style="color: #64748b;">Nessun utente in riserva.</p>';
                return;
            }

            const arrayRiserve = Object.keys(data)
                .filter(id => data[id] !== null && typeof data[id] === 'object' && data[id].stato === 'riserva')
                .map(id => ({ id, ...data[id] }));

            arrayRiserve.sort((a, b) => a.timestamp - b.timestamp);

            if (arrayRiserve.length === 0) {
                containerRiserva.innerHTML = '<p style="color: #64748b;">Nessun utente in riserva al momento.</p>';
                return;
            }

            arrayRiserve.forEach((persona, index) => {
                const orario = new Date(persona.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const div = document.createElement('div');
                div.className = 'item-riserva';

                const etichettaDelega = persona.delega ? ' <span class="badge-delega">⚠️ DELEGA</span>' : '';
                const infoDelegante = (persona.delega && persona.delegato) ? `<br><small style="color:#475569;">Delegante: <strong>${persona.delegato}</strong></small>` : '';
                const rigaTelefonoRiserva = persona.telefono ? `<br><small style="color:#475569;">📞 Tel: <strong>${persona.telefono}</strong></small>` : '';

                div.innerHTML = `
                    <div style="text-align: left;">
                        <strong style="color: #0f172a;">#${index + 1} - ${persona.nome}</strong>${etichettaDelega}
                        ${rigaTelefonoRiserva}
                        ${infoDelegante}
                        <br><small style="color: #94a3b8;">Inserito alle: ${orario}</small>
                    </div>
                    <div style="display: flex; gap: 8px; width: 100%;">
                        <button class="azione-promuovi btn-promuovi" data-id="${persona.id}">⬆️ Sposta</button>
                        <button class="azione-rimuovi btn-rimuovi" data-id="${persona.id}">🗑️</button>
                    </div>
                `;
                containerRiserva.appendChild(div);
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acquisizione Documento Remota</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #343a40; color: white; margin: 0; padding: 20px; }
        h3 { margin-bottom: 5px; }
        #istruzioniStep { font-size: 16px; color: #ffc107; font-weight: bold; margin-bottom: 15px; }
        video { width: 100%; max-width: 400px; border-radius: 8px; border: 2px solid #fff; margin-bottom: 15px; }
        canvas { display: none; }
        .btn-scatta { background-color: #28a745; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; max-width: 400px; }
        .btn-scatta:hover { background-color: #218838; }
        #loadingRemoto { display: none; margin-top: 15px; font-size: 14px; font-style: italic; color: #17a2b8; }
    </style>
</head>
<body>

    <h3 id="titoloSoggetto">Acquisizione Documento</h3>
    <div id="istruzioniStep">Inquadra il FRONTE del documento</div>

    <video id="webcamVideo" autoplay playsinline></video>
    <canvas id="webcamCanvas"></canvas>

    <div>
        <button type="button" class="btn-scatta" id="btnScattaRemota" onclick="scattaEInviaRemota()">📸 Scatta Foto</button>
    </div>

    <div id="loadingRemoto">Caricamento in corso...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadString } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const k1 = "AIzaSyCjfPICynrV";
        const k2 = "SeeVr4ifXoBoWi74nVGEt5Q";
        const firebaseConfig = {
            apiKey: k1 + k2,
            authDomain: "dbiscrizioni.firebaseapp.com",
            projectId: "dbiscrizioni",
            storageBucket: "dbiscrizioni.firebasestorage.app",
            messagingSenderId: "803347064813",
            appId: "1:803347064813:web:430a3fc4d0d1a3aa72e9e4"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);

        const urlParams = new URLSearchParams(window.location.search);
        const idPersona = urlParams.get('id');
        const soggetto = urlParams.get('soggetto'); // es. 'iscritto'

        let streamWebcam = null;
        let slotCorrente = 1; // 1 = Fronte, 2 = Retro

        document.getElementById('titoloSoggetto').textContent = `Documento (${soggetto.toUpperCase()})`;

        async function avviaCameraRemota() {
            try {
                streamWebcam = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "environment" }
                });
                document.getElementById('webcamVideo').srcObject = streamWebcam;
            } catch (err) {
                try {
                    streamWebcam = await navigator.mediaDevices.getUserMedia({ video: true });
                    document.getElementById('webcamVideo').srcObject = streamWebcam;
                } catch (e) {
                    alert("Impossibile accedere alla fotocamera dello smartphone: " + e.message);
                }
            }
        }

        avviaCameraRemota();

        function riduciImmagineBase64(dataUrl, maxWidth = 1024, quality = 0.6) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = dataUrl;
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
            });
        }

        window.scattaEInviaRemota = async function() {
            if (!idPersona || !soggetto) {
                alert("Parametri mancanti nell'URL.");
                return;
            }

            const video = document.getElementById('webcamVideo');
            const canvas = document.getElementById('webcamCanvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            let base64Originale = canvas.toDataURL('image/jpeg', 0.9);
            
            document.getElementById('loadingRemoto').style.display = 'block';
            document.getElementById('btnScattaRemota').disabled = true;

            try {
                let base64Compresso = await riduciImmagineBase64(base64Originale, 1024, 0.6);
                
                // Carica sullo slot corrente (1 = fronte, 2 = retro)
                const sRef = storageRef(storage, `documenti_iscritti/${idPersona}_${soggetto}_img${slotCorrente}.jpg`);
                await uploadString(sRef, base64Compresso, 'data_url');

                if (slotCorrente === 1) {
                    // Passa allo step successivo (Retro)
                    slotCorrente = 2;
                    document.getElementById('istruzioniStep').textContent = "Inquadra il RETRO del documento";
                    document.getElementById('istruzioniStepstyle')
                    document.getElementById('loadingRemoto').style.display = 'none';
                    document.getElementById('btnScattaRemota').disabled = false;
                    alert("✅ Fronte salvato con successo! Ora procedi con il RETRO.");
                } else {
                    // Completato anche il retro
                    document.getElementById('loadingRemoto').textContent = "Completato! Puoi chiudere questa pagina.";
                    alert("✅ Ottimo! Sia il Fronte che il Retro sono stati inviati con successo. Puoi chiudere questa finestra.");
                    window.close();
                }
            } catch (error) {
                document.getElementById('loadingRemoto').style.display = 'none';
                document.getElementById('btnScattaRemota').disabled = false;
                alert("Errore durante l'invio della foto: " + error.message);
            }
        };
    </script>
</body>
</html>

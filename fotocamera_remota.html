<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acquisizione Documento Remota</title>
    <style>
        html, body { 
            height: 100vh; 
            margin: 0; 
            padding: 5px; 
            box-sizing: border-box; 
        }
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: #343a40; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
            overflow: hidden; /* Blocca qualsiasi scroll */
        }
        h3 { margin: 2px 0; font-size: 16px; }
        #istruzioniStep { 
            font-size: 14px; 
            color: #ffc107; 
            font-weight: bold; 
            margin: 4px 0; 
            background: rgba(0,0,0,0.3); 
            padding: 6px 10px; 
            border-radius: 6px; 
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-height: calc(100vh - 150px);
            min-height: 0;
        }
        video { 
            max-width: 100%; 
            max-height: 100%; 
            width: auto;
            height: auto;
            border-radius: 6px; 
            border: 2px solid #fff; 
            object-fit: contain;
        }
        canvas { display: none; }
        .footer-action {
            width: 100%;
            max-width: 400px;
            margin-bottom: 5px;
        }
        .btn-scatta { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
3            cursor: pointer; 
            width: 100%; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
        }
        .btn-scatta:hover { background-color: #218838; }
        #loadingRemoto { display: none; margin-top: 5px; font-size: 14px; font-weight: bold; color: #17a2b8; }
    </style>
</head>
<body>

    <div>
        <h3 id="titoloSoggetto">Acquisizione Documento</h3>
        <div id="istruzioniStep">1️⃣ Inquadra e scatta il FRONTE</div>
    </div>

    <div class="video-container">
        <video id="webcamVideo" autoplay playsinline></video>
    </div>
    <canvas id="webcamCanvas"></canvas>

    <div class="footer-action">
        <button type="button" class="btn-scatta" id="btnScattaRemota" onclick="scattaEInviaRemota()">📸 Scatta Fronte</button>
        <div id="loadingRemoto">Caricamento in corso...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadString } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const k1 = "AIzaSyCjfPICynrV";
        const k2 = "SeeVr4ifXoBoWi74nVGEt5Q";
        const firebaseConfig = {
            apiKey: k1 + k2,
            authDomain: "dbiscrizioni.firebaseapp.com",
            projectId: "dbiscrizioni",
            storageBucket: "dbiscrizioni.firebasestorage.app",
            messagingSenderId: "803347064813",
            appId: "1:803347064813:web:430a3fc4d0d1a3aa72e9e4"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);

        const urlParams = new URLSearchParams(window.location.search);
        const idPersona = urlParams.get('id');
        const soggetto = urlParams.get('soggetto');

        let streamWebcam = null;
        let slotCorrente = 1; // 1 = Fronte, 2 = Retro

        document.getElementById('titoloSoggetto').textContent = `Documento (${soggetto ? soggetto.toUpperCase() : ''})`;

        async function avviaCameraRemota() {
            try {
                streamWebcam = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "environment" }
                });
                document.getElementById('webcamVideo').srcObject = streamWebcam;
            } catch (err) {
                try {
                    streamWebcam = await navigator.mediaDevices.getUserMedia({ video: true });
                    document.getElementById('webcamVideo').srcObject = streamWebcam;
                } catch (e) {
                    alert("Impossibile accedere alla fotocamera dello smartphone: " + e.message);
                }
            }
        }

        avviaCameraRemota();

        function riduciImmagineBase64(dataUrl, maxWidth = 1024, quality = 0.6) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = dataUrl;
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
            });
        }

        window.scattaEInviaRemota = async function() {
            if (!idPersona || !soggetto) {
                alert("Parametri mancanti nell'URL.");
                return;
            }

            const video = document.getElementById('webcamVideo');
            const canvas = document.getElementById('webcamCanvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            let base64Originale = canvas.toDataURL('image/jpeg', 0.9);
            
            document.getElementById('loadingRemoto').style.display = 'block';
            document.getElementById('loadingRemoto').textContent = slotCorrente === 1 ? "Caricamento Fronte in corso..." : "Caricamento Retro in corso...";
            document.getElementById('btnScattaRemota').disabled = true;

            try {
                let base64Compresso = await riduciImmagineBase64(base64Originale, 1024, 0.6);
                
                const sRef = storageRef(storage, `documenti_iscritti/${idPersona}_${soggetto}_img${slotCorrente}.jpg`);
                await uploadString(sRef, base64Compresso, 'data_url');

                document.getElementById('loadingRemoto').style.display = 'none';
                document.getElementById('btnScattaRemota').disabled = false;

                if (slotCorrente === 1) {
                    slotCorrente = 2;
                    document.getElementById('istruzioniStep').textContent = "2️⃣ Ottimo! Ora inquadra il RETRO";
                    document.getElementById('btnScattaRemota').textContent = "📸 Scatta Retro";
                    document.getElementById('btnScattaRemota').style.backgroundColor = "#ffc107";
                    document.getElementById('btnScattaRemota').style.color = "#000";
                } else {
                    document.getElementById('istruzioniStep').textContent = "✅ Fatto!";
                    document.getElementById('btnScattaRemota').style.display = 'none';
                    alert("✅ Entrambe le foto inviate correttamente! Puoi chiudere questa finestra.");
                    window.close();
                }
            } catch (error) {
                document.getElementById('loadingRemoto').style.display = 'none';
                document.getElementById('btnScattaRemota').disabled = false;
                alert("Errore durante l'invio: " + error.message);
            }
        };
    </script>
</body>
</html>

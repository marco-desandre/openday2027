<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acquisizione Documento Remota</title>
    <style>
        html, body { 
            height: 100vh; 
            margin: 0; 
            padding: 8px; 
            box-sizing: border-box; 
        }
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: #212529; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
            overflow: hidden; 
        }
        h3 { margin: 2px 0; font-size: 15px; color: #ced4da; }
        
        /* Contenitore video con effetto "pulsante interattivo" */
        .video-container {
            position: relative;
            flex: 1;
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #ffc107;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            background: #000;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
        }
        canvas { display: none; }

        /* Scritta in sovrimpressione (Overlay) */
        .overlay-testo {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 15px 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-top: 1px solid rgba(255,255,255,0.2);
            transition: background 0.2s;
        }
        .video-container:active .overlay-testo {
            background: rgba(40, 167, 69, 0.85); /* Feedback visivo al tap */
        }
        #istruzioniStep { 
            font-size: 16px; 
            color: #ffc107; 
            font-weight: bold; 
            margin: 0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .suggerimento-tap {
            font-size: 12px;
            color: #e9ecef;
            margin-top: 3px;
        }

        #loadingRemoto { 
            display: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(33, 37, 41, 0.85);
            justify-content: center;
            align-items: center;
            font-size: 18px; 
            font-weight: bold; 
            color: #17a2b8; 
            z-index: 10;
        }
    </style>
</head>
<body>

    <h3 id="titoloSoggetto">Documento</h3>

    <!-- Toccando tutta questa area si scatta la foto -->
	<div class="video-container" onclick="scattaEInviaRemota()">
		<video id="webcamVideo" autoplay playsinline muted></video>
		
		<div class="overlay-testo">
			<div id="istruzioniStep">Tap per scattare la foto del FRONTE</div>
			<div class="suggerimento-tap">📸 Tocca l'immagine per catturare</div>
		</div>

		<div id="loadingRemoto">Caricamento in corso...</div>
	</div>

    <canvas id="webcamCanvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadString } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const k1 = "AIzaSyCjfPICynrV";
        const k2 = "SeeVr4ifXoBoWi74nVGEt5Q";
        const firebaseConfig = {
            apiKey: k1 + k2,
            authDomain: "dbiscrizioni.firebaseapp.com",
            projectId: "dbiscrizioni",
            storageBucket: "dbiscrizioni.firebasestorage.app",
            messagingSenderId: "803347064813",
            appId: "1:803347064813:web:430a3fc4d0d1a3aa72e9e4"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);

        const urlParams = new URLSearchParams(window.location.search);
        const idPersona = urlParams.get('id');
        const soggetto = urlParams.get('soggetto');

        let streamWebcam = null;
        let slotCorrente = 1; // 1 = Fronte, 2 = Retro
        let inAcquisizione = semaforoLock = false;

        document.getElementById('titoloSoggetto').textContent = `Acquisizione Documento (${soggetto ? soggetto.toUpperCase() : ''})`;

        async function avviaCameraRemota() {
            try {
                // Tenta prima di usare la fotocamera posteriore (principale) dello smartphone
                streamWebcam = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        width: { ideal: 1280 }, 
                        height: { ideal: 720 }, 
                        facingMode: { exact: "environment" } 
                    }
                });
            } catch (err1) {
                try {
                    // Fallback se 'exact: environment' non è supportato o fallisce
                    streamWebcam = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                } catch (err2) {
                    try {
                        // Ultimo tentativo generico con qualsiasi fotocamera disponibile
                        streamWebcam = await navigator.mediaDevices.getUserMedia({ video: true });
                    } catch (errFinal) {
                        alert("⚠️ Impossibile accedere alla fotocamera.\n\nAssicurati di aprire il link tramite HTTPS e di aver concesso i permessi al browser.\nDettaglio: " + errFinal.message);
                        return;
                    }
                }
            }
            
            const videoElement = document.getElementById('webcamVideo');
            videoElement.srcObject = streamWebcam;
            await videoElement.play().catch(e => console.log("Play automatico intercettato:", e));
        }

        avviaCameraRemota();

        function riduciImmagineBase64(dataUrl, maxWidth = 1024, quality = 0.6) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = dataUrl;
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
            });
        }

        window.scattaEInviaRemota = async function() {
            if (inAcquisizione) return;
            if (!idPersona || !soggetto) {
                alert("Parametri mancanti nell'URL.");
                return;
            }

            inAcquisizione = true;
            const video = document.getElementById('webcamVideo');
            const canvas = document.getElementById('webcamCanvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            let base64Originale = canvas.toDataURL('image/jpeg', 0.9);
            
            const loader = document.getElementById('loadingRemoto');
            loader.style.display = 'flex';
            loader.textContent = slotCorrente === 1 ? "Caricamento Fronte in corso..." : "Caricamento Retro in corso...";

            try {
                let base64Compresso = await riduciImmagineBase64(base64Originale, 1024, 0.6);
                
                const sRef = storageRef(storage, `documenti_iscritti/${idPersona}_${soggetto}_img${slotCorrente}.jpg`);
                await uploadString(sRef, base64Compresso, 'data_url');

                loader.style.display = 'none';

                if (slotCorrente === 1) {
                    slotCorrente = 2;
                    document.getElementById('istruzioniStep').textContent = "Tap per scattare la foto del RETRO";
                    let container = document.querySelector('.video-container');
                    container.style.borderColor = "#28a745"; // Cambio colore bordo per indicare il cambio step
                } else {
                    document.getElementById('istruzioniStep').textContent = "✅ Fatto!";
                    alert("✅ Entrambe le foto (Fronte e Retro) sono state inviate correttamente! Puoi chiudere questa finestra.");
                    window.close();
                }
            } catch (error) {
                loader.style.display = 'none';
                alert("Errore durante l'invio: " + error.message);
            } finally {
                inAcquisizione = false;
            }
        };
    </script>
</body>
</html>

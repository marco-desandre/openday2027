<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schermo Sala d'Attesa - OpenDay 2027</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #1a1a2e; 
            color: #ffffff; 
            text-align: center; 
            padding: 40px 20px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container { 
            max-width: 800px; 
            margin: auto; 
            background: #16213e; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.5); 
        }
        h1 { 
            color: #e94560; 
            margin-top: 0; 
            font-size: 36px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        .istruzioni { 
            font-size: 20px; 
            color: #a0aab2; 
            margin-bottom: 30px; 
        }
        
        /* Box dei numeri chiamati */
        #listaChiamati {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .biglietto-chiamato {
            background: #ffc107;
            color: #000;
            font-size: 60px;
            font-weight: bold;
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
            animation: lampcheggio 1.2s infinite alternate;
        }

        .nessun-turno {
            font-size: 24px;
            color: #6c757d;
            font-style: italic;
            background: #0f3460;
            padding: 30px;
            border-radius: 10px;
        }

        /* Pulsante per sbloccare l'audio */
        #btnAttivaAudio {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            transition: background 0.2s;
        }
        #btnAttivaAudio:hover {
            background-color: #d73852;
        }

        /* Effetto lampeggiante per attirare l'attenzione */
        @keyframes lampcheggio {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.05); opacity: 0.85; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>OpenDay 2027</h1>
        
        <!-- Pulsante sblocco audio per i browser -->
        <button id="btnAttivaAudio">🔊 Clicca qui per attivare l'audio</button>

        <div class="istruzioni">Prossimi numeri chiamati al banco iscrizioni:</div>
        
        <div id="listaChiamati">
            <div class="nessun-turno">In attesa di chiamate...</div>
        </div>
    </div>

    <!-- Script Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXtD-62C2rWpsZoEhW85HN1pxTe8a5jL4",
            authDomain: "opendayiscrizioni.firebaseapp.com",
            databaseURL: "https://opendayiscrizioni-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "opendayiscrizioni",
            storageBucket: "opendayiscrizioni.firebasestorage.app",
            messagingSenderId: "448538612897",
            appId: "1:448538612897:web:437a8b17991687fc0a8ce0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const codaRef = ref(db, 'coda');

        let ultimiChiamatiNotificati = new Set();
        let audioAbilitato = false;

        // Gestione del click sul pulsante di sblocco audio
        document.getElementById('btnAttivaAudio').addEventListener('click', () => {
            audioAbilitato = true;
            document.getElementById('btnAttivaAudio').style.display = 'none'; // Nasconde il bottone una volta cliccato
            
            // Test vocale silenzioso/di conferma all'attivazione
            if ('speechSynthesis' in window) {
                const testUtterance = new SpeechSynthesisUtterance("Audio attivo");
                testUtterance.lang = 'it-IT';
                testUtterance.volume = 0.1; // Basso volume per il test
                window.speechSynthesis.speak(testUtterance);
            }
        });

        // Funzione per pronunciare il numero
        // Funzione per pronunciare il numero con la voce migliore disponibile
        function pronunciaNumero(numero) {
            if (!audioAbilitato || !('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel(); // Ferma eventuali letture precedenti

            const testoDaDire = `Attenzione. Numero... ${numero}`;
            const utterance = new SpeechSynthesisUtterance(testoDaDire);
            utterance.lang = 'it-IT';
            utterance.rate = 0.85; // Leggermente più lenta e scandita
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            // Cerca una voce italiana di alta qualità (es. Google o Microsoft Natural)
            const voci = window.speechSynthesis.getVoices();
            const voceItalianaMigliore = voci.find(v => v.lang.includes('it') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Online'))) || voci.find(v => v.lang.includes('it'));

            if (voceItalianaMigliore) {
                utterance.voice = voceItalianaMigliore;
            }

            window.speechSynthesis.speak(utterance);
        }

        // Alcuni browser caricano le voci in modo asincrono, questo assicura di prenderle
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        onValue(codaRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('listaChiamati');
            container.innerHTML = '';

            if (!data) {
                container.innerHTML = '<div class="nessun-turno">Nessun turno in corso.</div>';
                ultimiChiamatiNotificati.clear();
                return;
            }

            const arrayCoda = Object.keys(data).map(id => ({ id, ...data[id] }))
                .sort((a, b) => a.timestamp - b.timestamp);

            const chiamati = arrayCoda.filter(item => item.stato === 'chiamato');

            if (chiamati.length === 0) {
                container.innerHTML = '<div class="nessun-turno">Nessun numero chiamato al momento. Attendi il tuo turno.</div>';
                ultimiChiamatiNotificati.clear();
                return;
            }

            const nuoviChiamatiCorrenti = new Set();

            chiamati.forEach(persona => {
                const numeroBiglietto = arrayCoda.findIndex(p => p.id === persona.id) + 1;
                nuoviChiamatiCorrenti.add(numeroBiglietto);

                if (!ultimiChiamatiNotificati.has(numeroBiglietto)) {
                    pronunciaNumero(numeroBiglietto);
                }

                const div = document.createElement('div');
                div.className = 'biglietto-chiamato';
                div.innerText = `N° ${numeroBiglietto}`;
                container.appendChild(div);
            });

            ultimiChiamatiNotificati = nuoviChiamatiCorrenti;
        });
    </script>
</body>
</html>

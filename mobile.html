<!-- MODALE SCHEDA ISCRITTO AGGIORNATA -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <button type="button" class="btn-chiudi-x" id="btnChiudiX">&times;</button>
            <h3 id="modalTitle" style="font-size: 18px; color: #007BFF; margin-top: 0;">Scheda Iscritto e Storico</h3>
            <input type="hidden" id="editIdPersona">
            
            <div id="messaggioRuntimeDuplicato" style="font-size: 12px; font-weight: bold; margin-bottom: 5px;"></div>

            <div class="form-row">
                <div class="form-group"><label>Cognome:</label><input type="text" id="editCognome" class="campo-controllo"></div>
                <div class="form-group"><label>Nome:</label><input type="text" id="editNome" class="campo-controllo"></div>
                <div class="form-group"><label>Codice Fiscale:</label><input type="text" id="editCodiceFiscale" style="text-transform: uppercase;"></div>
                <div class="form-group"><label>Data di Nascita:</label><input type="date" id="editDataNascita"></div>
                <div class="form-group"><label>Città:</label><input type="text" id="editCitta"></div>
                <div class="form-group"><label>Telefono:</label><input type="text" id="editTelefono"></div>
            </div>

            <div class="box-bottoni-modale">
                <button type="button" id="btnAggiungiIscrizione" class="btn-aggiungi-iscrizione" onclick="attivaInserimentoNuovaIscrizioneEsistente()">+ Iscrizione</button>
                <button type="button" id="btnSalva" class="btn-salva" onclick="gestisciSalvataggioEsistente()">Salva Anagrafica</button>
            </div>

            <div id="sezioneStoricoContainer" style="display: block; margin-top: 15px;">
                <h4 style="font-size: 14px; border-bottom: 2px solid #007BFF; padding-bottom: 4px; margin-bottom: 8px;">Storico Iscrizioni</h4>
                <div id="storicoCaricamento" style="font-size: 13px; color: #666; font-style: italic;">Caricamento storico...</div>
                <div class="table-responsive">
                    <table id="tabellaStorico" style="display: none;">
                        <thead>
                            <tr>
                                <th>Anno</th>
                                <th>Tipo Iscrizione</th>
                                <th>N. Identificativo</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabellaStorico"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
